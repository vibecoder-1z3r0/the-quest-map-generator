name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: make check PY=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/index.html

  # Merges to main publish the site at the root of the gh-pages branch, keeping the PR previews.
  # Publishing is plain git in scripts/pages_publish.sh (tested); only GitHub's own actions are used.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site
      - run: bash scripts/pages_publish.sh main
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Each PR from this repository gets a preview at <site>/pr-preview/pr-<number>/ and a comment
  # with the link. The preview is removed when the PR is closed or merged (pr-preview-cleanup.yml).
  preview:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site
      - run: bash scripts/pages_publish.sh preview "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Comment the preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          repo=${GITHUB_REPOSITORY#*/}
          url="https://${owner}.github.io/${repo}/pr-preview/pr-${PR_NUMBER}/"
          body=$(printf 'Preview for this PR: %s\n\nBuilt from %s. GitHub Pages can take a minute or two to publish it. The preview is removed when this PR is closed or merged.' "$url" "${HEAD_SHA:0:7}")
          gh pr comment "$PR_NUMBER" --edit-last --body "$body" || gh pr comment "$PR_NUMBER" --body "$body"
