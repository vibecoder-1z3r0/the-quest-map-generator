name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: make check PY=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/index.html

  # Merges to main publish the site at the root of the gh-pages branch, keeping the PR previews.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4  # the deploy action needs a git checkout
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/

  # Each PR from this repository gets a preview at <site>/pr-preview/pr-<number>/ and a comment
  # with the link. The preview is removed when the PR is closed or merged (pr-preview-cleanup.yml).
  preview:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4  # the preview action needs a git checkout
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
