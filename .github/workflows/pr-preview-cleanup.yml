name: Remove PR preview

# Runs when a pull request is closed or merged and deletes its preview folder from gh-pages.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/pages_publish.sh remove "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR_NUMBER" --edit-last --body "The preview for this PR has been removed." || true
