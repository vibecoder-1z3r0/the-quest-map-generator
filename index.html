<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Map Generator</title>
<style>
  :root {
    --bg: #1b1610; --panel: #261f16; --panel2: #302719; --ink: #f0e6d0; --muted: #a8977a;
    --accent: #c9a24a; --accent-ink: #1b1610; --border: #4a3d28; --danger: #b3412f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-family: Georgia, serif; color: var(--accent); letter-spacing: .5px; margin-right: auto; }
  header .linkinfo { color: var(--muted); font-size: 12px; }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #banner { display: none; background: var(--danger); color: #fff; padding: 6px 14px; }
  main { flex: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr) 320px; min-height: 0; }
  aside { background: var(--panel); overflow-y: auto; padding: 10px; }
  #tools { border-right: 1px solid var(--border); }
  #text { border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 12px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .tgrid button { padding: 5px 6px; text-align: left; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.5); flex: none; }
  #stage { padding: 12px; overflow: auto; display: flex; align-items: flex-start; justify-content: center; background: #120e0a; }
  #board { width: 100%; max-width: 1100px; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; background: #0d0a07; border-radius: 4px; cursor: crosshair; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--ink); background: #1a150e; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  textarea { resize: vertical; min-height: 90px; }
  #notes { border-color: #7a3a2a; min-height: 160px; }
  .secret label { color: #d98a76; }
  .hint { color: var(--muted); font-size: 12px; }
  kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 11px; }
  #print { display: none; }

  @media (max-width: 980px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    #tools { border-right: 0; border-bottom: 1px solid var(--border); }
    #text { border-left: 0; border-top: 1px solid var(--border); }
    .tgrid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
  @media print {
    body { background: #fff; color: #000; display: block; height: auto; }
    header, #tools, #text, #banner { display: none !important; }
    main { display: block; }
    #stage { background: #fff; padding: 0; overflow: visible; }
    #board { max-width: 100%; cursor: default; background: #fff; }
    #print { display: block; margin-top: 12px; font-family: Georgia, serif; color: #000; }
    #print h2 { margin: 0 0 4px; font-size: 20px; }
    #print p { white-space: pre-wrap; margin: 0 0 10px; }
    #print h3 { margin: 10px 0 2px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    @page { margin: 10mm; }
  }
</style>
</head>
<body>
<header>
  <h1>Quest Map Generator</h1>
  <span class="linkinfo" id="linkinfo">The map lives in the URL – copy the link to share it</span>
  <button id="copy" class="primary">Copy link</button>
  <button id="print-btn">Print</button>
  <button id="clear">New map</button>
</header>
<div id="banner"></div>
<main>
  <aside id="tools"></aside>
  <section id="stage">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </section>
  <aside id="text">
    <div>
      <label for="qnum">Quest number</label>
      <input type="text" id="qnum" maxlength="20" autocomplete="off">
    </div>
    <div>
      <label for="qtitle">Quest title</label>
      <input type="text" id="qtitle" autocomplete="off">
    </div>
    <div>
      <label for="qintro">Quest intro (read aloud to the heroes)</label>
      <textarea id="qintro"></textarea>
    </div>
    <div class="secret">
      <label for="notes">Zargon's notes – secret</label>
      <textarea id="notes"></textarea>
    </div>
    <p class="hint">
      <kbd>R</kbd> rotate · <kbd>Del</kbd> remove selected · <kbd>Esc</kbd> deselect.<br>
      Browser back/forward steps through your edits.<br>
      Anyone with the link can read the notes – it's all in the URL.
    </p>
  </aside>
</main>
<div id="print"></div>

<script>
"use strict";
// ───────────────────────── constants & catalogue ─────────────────────────
const W = 26, H = 19, S = 32, PAD = 10;
const VERSION = 1;

// IDs are part of the URL format – never renumber, only append.
const CATALOG = [
  // furniture (layer 'f')
  { id: 1,  name: "Stairs",           g: "Furniture", w: 2, h: 2, layer: "f", color: "#8d8d94", label: "Stairs" },
  { id: 2,  name: "Table",            g: "Furniture", w: 3, h: 2, layer: "f", color: "#9a6a38", label: "Table" },
  { id: 3,  name: "Tomb",             g: "Furniture", w: 3, h: 2, layer: "f", color: "#6f7a73", label: "Tomb" },
  { id: 4,  name: "Bookcase",         g: "Furniture", w: 3, h: 1, layer: "f", color: "#7b5530", label: "Bookcase" },
  { id: 5,  name: "Cupboard",         g: "Furniture", w: 3, h: 1, layer: "f", color: "#8a6a45", label: "Cupboard" },
  { id: 6,  name: "Fireplace",        g: "Furniture", w: 3, h: 1, layer: "f", color: "#b5602f", label: "Fireplace" },
  { id: 7,  name: "Throne",           g: "Furniture", w: 1, h: 1, layer: "f", color: "#b8962e", label: "Th" },
  { id: 8,  name: "Weapons rack",     g: "Furniture", w: 3, h: 1, layer: "f", color: "#77777f", label: "Weapons" },
  { id: 9,  name: "Alchemist's bench",g: "Furniture", w: 3, h: 2, layer: "f", color: "#4f8a6a", label: "Alchemist" },
  { id: 10, name: "Sorcerer's table", g: "Furniture", w: 3, h: 2, layer: "f", color: "#6a5aa8", label: "Sorcerer" },
  { id: 11, name: "Torture rack",     g: "Furniture", w: 3, h: 2, layer: "f", color: "#8a4a44", label: "Rack" },
  { id: 16, name: "Rubble",           g: "Furniture", w: 1, h: 1, layer: "f", color: "#6a625a", label: "Rbl" },
  // tokens (layer 't')
  { id: 12, name: "Treasure chest",   g: "Treasure & traps", w: 1, h: 1, layer: "t", color: "#d4a82a", label: "Chest" },
  { id: 13, name: "Pit trap",         g: "Treasure & traps", w: 1, h: 1, layer: "t", color: "#d9772b", label: "Pit" },
  { id: 14, name: "Spear trap",       g: "Treasure & traps", w: 1, h: 1, layer: "t", color: "#d9772b", label: "Spr" },
  { id: 15, name: "Falling rock trap",g: "Treasure & traps", w: 1, h: 1, layer: "t", color: "#d9772b", label: "Rock" },
  { id: 20, name: "Goblin",           g: "Monsters", w: 1, h: 1, layer: "t", color: "#5da04a", label: "Gb", round: 1 },
  { id: 21, name: "Orc",              g: "Monsters", w: 1, h: 1, layer: "t", color: "#4d8a3a", label: "Or", round: 1 },
  { id: 22, name: "Fimir",            g: "Monsters", w: 1, h: 1, layer: "t", color: "#4a9a8a", label: "Fi", round: 1 },
  { id: 23, name: "Skeleton",         g: "Monsters", w: 1, h: 1, layer: "t", color: "#c9c4b0", label: "Sk", round: 1, dark: 1 },
  { id: 24, name: "Zombie",           g: "Monsters", w: 1, h: 1, layer: "t", color: "#8aa07a", label: "Zo", round: 1 },
  { id: 25, name: "Mummy",            g: "Monsters", w: 1, h: 1, layer: "t", color: "#b9a77a", label: "Mu", round: 1, dark: 1 },
  { id: 26, name: "Chaos Warrior",    g: "Monsters", w: 1, h: 1, layer: "t", color: "#a03a3a", label: "CW", round: 1 },
  { id: 27, name: "Gargoyle",         g: "Monsters", w: 1, h: 1, layer: "t", color: "#7a7a8a", label: "Ga", round: 1 },
  { id: 28, name: "Dread Warrior",    g: "Monsters", w: 1, h: 1, layer: "t", color: "#6a2a5a", label: "DW", round: 1 },
  { id: 29, name: "Other monster",    g: "Monsters", w: 1, h: 1, layer: "t", color: "#8a3030", label: "?",  round: 1 },
  { id: 40, name: "Barbarian",        g: "Heroes", w: 1, h: 1, layer: "t", color: "#3a6fc0", label: "Ba", round: 1 },
  { id: 41, name: "Dwarf",            g: "Heroes", w: 1, h: 1, layer: "t", color: "#3a6fc0", label: "Dw", round: 1 },
  { id: 42, name: "Elf",              g: "Heroes", w: 1, h: 1, layer: "t", color: "#3a6fc0", label: "El", round: 1 },
  { id: 43, name: "Wizard",           g: "Heroes", w: 1, h: 1, layer: "t", color: "#3a6fc0", label: "Wi", round: 1 },
];
for (let n = 1; n <= 9; n++) {
  CATALOG.push({ id: 49 + n, name: "Marker " + n, g: "Markers", w: 1, h: 1, layer: "t", color: "#8a58b8", label: String(n), round: 1 });
}
const CAT = {};
CATALOG.forEach(c => CAT[c.id] = c);

// ───────────────────────── state ─────────────────────────
function blankState() {
  return { floor: new Uint8Array(W * H), doors: new Map(), items: [], num: "", title: "", intro: "", notes: "" };
}
let state = blankState();
let tool = { kind: "floor", type: 0 };
let selected = -1;      // index into state.items
let ghostRot = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dims = (it) => { const d = CAT[it.t]; return it.r ? [d.h, d.w] : [d.w, d.h]; };
const isFloor = (x, y) => x >= 0 && y >= 0 && x < W && y < H && state.floor[y * W + x] === 1;
const doorKey = (x, y, o) => x + "," + y + "," + o;

// ───────────────────────── encoding ─────────────────────────
// payload = [VERSION] + deflateRaw(body)
// body    = floorBits(62B) · doorCount · doors(2B each) · itemCount · items(3B each) · 4 length-prefixed UTF-8 strings
function toB64u(bytes) {
  let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64u(str) {
  str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "=";
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pipe(bytes, stream) {
  const r = new Response(new Blob([bytes]).stream().pipeThrough(stream));
  return new Uint8Array(await r.arrayBuffer());
}
function pushVarint(out, n) { while (n >= 0x80) { out.push((n & 0x7f) | 0x80); n >>>= 7; } out.push(n); }

async function encodeState(st) {
  const out = [];
  const bits = new Uint8Array(Math.ceil(W * H / 8));
  for (let i = 0; i < W * H; i++) if (st.floor[i]) bits[i >> 3] |= 1 << (i & 7);
  out.push(...bits);
  pushVarint(out, st.doors.size);
  for (const [k, t] of st.doors) {
    const [x, y, o] = k.split(",").map(Number);
    const v = x | (y << 5) | (o << 10) | (t << 11);
    out.push(v & 255, v >> 8);
  }
  pushVarint(out, st.items.length);
  for (const it of st.items) out.push(it.t | (it.r << 7), it.x, it.y);
  const enc = new TextEncoder();
  for (const s of [st.num, st.title, st.intro, st.notes]) {
    const b = enc.encode(s); pushVarint(out, b.length); for (let i = 0; i < b.length; i++) out.push(b[i]);
  }
  const comp = await pipe(new Uint8Array(out), new CompressionStream("deflate-raw"));
  const full = new Uint8Array(comp.length + 1); full[0] = VERSION; full.set(comp, 1);
  return toB64u(full);
}

async function decodeState(str) {
  const full = fromB64u(str);
  if (full[0] !== VERSION) throw new Error("Unsupported link version " + full[0]);
  const body = await pipe(full.subarray(1), new DecompressionStream("deflate-raw"));
  let p = 0;
  const need = n => { if (p + n > body.length) throw new Error("Truncated data"); };
  const varint = () => { let n = 0, sh = 0, b; do { need(1); b = body[p++]; n |= (b & 0x7f) << sh; sh += 7; } while (b & 0x80); return n; };
  const st = blankState();
  const nb = Math.ceil(W * H / 8); need(nb);
  for (let i = 0; i < W * H; i++) st.floor[i] = (body[p + (i >> 3)] >> (i & 7)) & 1;
  p += nb;
  const nd = varint(); need(nd * 2);
  for (let i = 0; i < nd; i++) {
    const v = body[p] | (body[p + 1] << 8); p += 2;
    const x = v & 31, y = (v >> 5) & 31, o = (v >> 10) & 1, t = (v >> 11) & 1;
    if (x < W && y < H && (o ? y < H - 1 : x < W - 1)) st.doors.set(doorKey(x, y, o), t);
  }
  const ni = varint(); need(ni * 3);
  for (let i = 0; i < ni; i++) {
    const tb = body[p], x = body[p + 1], y = body[p + 2]; p += 3;
    const t = tb & 127, r = tb >> 7;
    if (!CAT[t]) continue;
    const it = { t, x, y, r }; const [w, h] = dims(it);
    if (x + w <= W && y + h <= H) st.items.push(it);
  }
  const dec = new TextDecoder(), strs = [];
  for (let i = 0; i < 4; i++) { const n = varint(); need(n); strs.push(dec.decode(body.subarray(p, p + n))); p += n; }
  [st.num, st.title, st.intro, st.notes] = strs;
  return st;
}

// ───────────────────────── URL sync ─────────────────────────
let seq = 0, pendingPush = false, lastHash = "", urlTimer = 0;
function scheduleUrl(push, delay) {
  pendingPush = pendingPush || push;
  clearTimeout(urlTimer);
  urlTimer = setTimeout(syncUrl, delay || 0);
}
async function syncUrl() {
  const my = ++seq;
  let h;
  try { h = "#" + await encodeState(state); } catch (e) { showBanner("Could not encode map: " + e.message); return; }
  if (my !== seq) return;
  const push = pendingPush; pendingPush = false;
  if (h !== lastHash) {
    lastHash = h;
    (push ? history.pushState : history.replaceState).call(history, null, "", h);
  }
  $("#linkinfo").textContent = "Link length: " + (location.href.length).toLocaleString() + " characters";
}
async function loadFromHash() {
  const h = location.hash;
  if (h === lastHash) return;
  lastHash = h;
  hideBanner();
  if (h.length <= 1) { state = blankState(); }
  else {
    try { state = await decodeState(h.slice(1)); }
    catch (e) { state = blankState(); showBanner("Couldn't read a map from this link (" + e.message + "). Starting with a blank map."); }
  }
  selected = -1;
  syncFields(); render();
}
function showBanner(msg) { const b = $("#banner"); b.textContent = msg; b.style.display = "block"; }
function hideBanner() { $("#banner").style.display = "none"; }

// ───────────────────────── rendering ─────────────────────────
const svg = $("#board");
svg.setAttribute("viewBox", `0 0 ${W * S + PAD * 2} ${H * S + PAD * 2}`);
svg.innerHTML = `
  <defs><pattern id="grid" width="${S}" height="${S}" patternUnits="userSpaceOnUse">
    <path d="M ${S} 0 L 0 0 0 ${S}" fill="none" stroke="#2a2218" stroke-width="1"/></pattern></defs>
  <rect width="100%" height="100%" fill="#0d0a07"/>
  <g transform="translate(${PAD},${PAD})">
    <rect width="${W * S}" height="${H * S}" fill="#17120c"/>
    <rect width="${W * S}" height="${H * S}" fill="url(#grid)"/>
    <g id="base"></g><g id="over" pointer-events="none"></g>
  </g>`;
const baseG = $("#base"), overG = $("#over");

function itemSVG(it, opts = {}) {
  const d = CAT[it.t], [w, h] = dims(it);
  const x = it.x * S, y = it.y * S, pw = w * S, ph = h * S;
  const stroke = opts.sel ? "#fff" : "rgba(0,0,0,.65)";
  const sw = opts.sel ? 3 : 1.5;
  const tc = d.dark ? "#1b1610" : "#fff";
  let s = `<g opacity="${opts.ghost ? 0.6 : 1}">`;
  if (d.round) {
    s += `<circle cx="${x + pw / 2}" cy="${y + ph / 2}" r="${S / 2 - 3}" fill="${d.color}" stroke="${stroke}" stroke-width="${sw}"/>`;
  } else {
    s += `<rect x="${x + 2}" y="${y + 2}" width="${pw - 4}" height="${ph - 4}" rx="4" fill="${d.color}" stroke="${stroke}" stroke-width="${sw}"/>`;
  }
  const vertical = !d.round && h > w;
  const fs = Math.min(14, (Math.max(pw, ph) - 8) / (d.label.length * 0.62));
  const cx = x + pw / 2, cy = y + ph / 2;
  s += `<text x="${cx}" y="${cy}" fill="${tc}" font-size="${fs}" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle" dominant-baseline="central"` +
       (vertical ? ` transform="rotate(90 ${cx} ${cy})"` : "") + `>${esc(d.label)}</text>`;
  if (d.id === 1) { // stairs: draw steps
    for (let i = 1; i < 4; i++) s += `<line x1="${x + 4}" x2="${x + pw - 4}" y1="${y + (ph * i) / 4}" y2="${y + (ph * i) / 4}" stroke="rgba(0,0,0,.35)"/>`;
  }
  return s + "</g>";
}

function render() {
  let s = "";
  // floor
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (state.floor[y * W + x]) {
    s += `<rect x="${x * S}" y="${y * S}" width="${S}" height="${S}" fill="#e6d7ae" stroke="#bfae80" stroke-width="1"/>`;
  }
  // walls (edges between floor and non-floor)
  let wl = "";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (state.floor[y * W + x]) {
    const X = x * S, Y = y * S;
    if (!isFloor(x - 1, y)) wl += `M${X} ${Y}V${Y + S}`;
    if (!isFloor(x + 1, y)) wl += `M${X + S} ${Y}V${Y + S}`;
    if (!isFloor(x, y - 1)) wl += `M${X} ${Y}H${X + S}`;
    if (!isFloor(x, y + 1)) wl += `M${X} ${Y + S}H${X + S}`;
  }
  s += `<path d="${wl}" stroke="#2b1d10" stroke-width="5" stroke-linecap="square" fill="none"/>`;
  // furniture, doors, tokens
  state.items.forEach((it, i) => { if (CAT[it.t].layer === "f") s += itemSVG(it, { sel: i === selected }); });
  for (const [k, t] of state.doors) {
    const [x, y, o] = k.split(",").map(Number);
    const fill = t ? "#f0e6d0" : "#8b5a2b", dash = t ? ' stroke-dasharray="3 2"' : "";
    if (o === 0) {
      const X = (x + 1) * S, Y = y * S;
      s += `<rect x="${X - 5}" y="${Y + 3}" width="10" height="${S - 6}" rx="2" fill="${fill}" stroke="#2b1d10" stroke-width="1.5"${dash}/>`;
      if (t) s += `<text x="${X}" y="${Y + S / 2}" font-size="9" font-weight="700" fill="#2b1d10" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif">S</text>`;
    } else {
      const X = x * S, Y = (y + 1) * S;
      s += `<rect x="${X + 3}" y="${Y - 5}" width="${S - 6}" height="10" rx="2" fill="${fill}" stroke="#2b1d10" stroke-width="1.5"${dash}/>`;
      if (t) s += `<text x="${X + S / 2}" y="${Y}" font-size="9" font-weight="700" fill="#2b1d10" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif">S</text>`;
    }
  }
  state.items.forEach((it, i) => { if (CAT[it.t].layer === "t") s += itemSVG(it, { sel: i === selected }); });
  baseG.innerHTML = s;
  document.title = ((state.num ? "Quest " + state.num : "Quest") + (state.title ? ": " + state.title : "")) + " – Quest Map Generator";
  const p = $("#print");
  p.innerHTML = `<h2>${esc((state.num ? "Quest " + state.num : "") + (state.title ? (state.num ? " – " : "") + state.title : ""))}</h2>` +
    (state.intro ? `<h3>Introduction</h3><p>${esc(state.intro)}</p>` : "") +
    (state.notes ? `<h3>Zargon's notes</h3><p>${esc(state.notes)}</p>` : "");
}

// ───────────────────────── editing ─────────────────────────
function pruneDoors() {
  for (const k of [...state.doors.keys()]) {
    const [x, y, o] = k.split(",").map(Number);
    if (!isFloor(x, y) && !isFloor(o ? x : x + 1, o ? y + 1 : y)) state.doors.delete(k);
  }
}
function itemsAt(x, y, layer) {
  const r = [];
  state.items.forEach((it, i) => {
    if (layer && CAT[it.t].layer !== layer) return;
    const [w, h] = dims(it);
    if (x >= it.x && x < it.x + w && y >= it.y && y < it.y + h) r.push(i);
  });
  return r;
}
function overlaps(a, b) {
  const [aw, ah] = dims(a), [bw, bh] = dims(b);
  return a.x < b.x + bw && b.x < a.x + aw && a.y < b.y + bh && b.y < a.y + ah;
}
function placeItem(t, x, y, r) {
  const d = CAT[t];
  const probe = { t, x: 0, y: 0, r }, [w, h] = dims(probe);
  const it = { t, x: clamp(x, 0, W - w), y: clamp(y, 0, H - h), r: w === h ? 0 : r };
  const keepSel = selected >= 0 ? state.items[selected] : null;
  state.items = state.items.filter(o => !(CAT[o.t].layer === d.layer && overlaps(o, it)));
  state.items.push(it);
  selected = keepSel && state.items.includes(keepSel) ? state.items.indexOf(keepSel) : -1;
}
function rotateItem(it) {
  if (!it) return;
  const [w, h] = dims(it); if (w === h) return;
  it.r ^= 1;
  const [nw, nh] = dims(it);
  it.x = clamp(it.x, 0, W - nw); it.y = clamp(it.y, 0, H - nh);
}
function removeSelected() {
  if (selected < 0) return false;
  state.items.splice(selected, 1); selected = -1; return true;
}

// pointer → board coordinates
function boardPoint(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM(); if (!m) return null;
  const p = pt.matrixTransform(m.inverse());
  return { x: (p.x - PAD) / S, y: (p.y - PAD) / S };
}
function cellAt(e) {
  const p = boardPoint(e); if (!p) return null;
  const cx = Math.floor(p.x), cy = Math.floor(p.y);
  if (cx < 0 || cy < 0 || cx >= W || cy >= H) return null;
  return { cx, cy, fx: p.x - cx, fy: p.y - cy };
}
// nearest cell edge, canonicalised to (x, y, orientation 0=right edge / 1=bottom edge)
function edgeAt(c) {
  const d = [c.fx, 1 - c.fx, c.fy, 1 - c.fy], m = Math.min(...d), i = d.indexOf(m);
  let x = c.cx, y = c.cy, o;
  if (i === 0) { x -= 1; o = 0; } else if (i === 1) { o = 0; } else if (i === 2) { y -= 1; o = 1; } else { o = 1; }
  if (x < 0 || y < 0 || x >= W || y >= H) return null;
  if (o === 0 && x >= W - 1) return null;
  if (o === 1 && y >= H - 1) return null;
  return { x, y, o };
}

let drawing = null; // active drag: { value, changed }
let hover = null;

svg.addEventListener("pointerdown", e => {
  if (e.button !== 0 && e.pointerType === "mouse") return;
  const c = cellAt(e); if (!c) return;
  e.preventDefault();
  hover = c;
  const k = tool.kind; let changed = false;
  if (k === "floor" || k === "unfloor") {
    const v = k === "floor" ? 1 : 0;
    drawing = { value: v, changed: false };
    svg.setPointerCapture(e.pointerId);
    if (state.floor[c.cy * W + c.cx] !== v) { state.floor[c.cy * W + c.cx] = v; drawing.changed = true; render(); }
    return;
  }
  if (k === "door" || k === "secret") {
    const ed = edgeAt(c);
    if (ed) {
      const key = doorKey(ed.x, ed.y, ed.o), want = k === "secret" ? 1 : 0;
      if (state.doors.get(key) === want) state.doors.delete(key); else state.doors.set(key, want);
      changed = true;
    }
  } else if (k === "item") {
    placeItem(tool.type, c.cx, c.cy, ghostRot); changed = true;
  } else if (k === "select") {
    const hit = itemsAt(c.cx, c.cy, "t").concat(itemsAt(c.cx, c.cy, "f"));
    selected = hit.length ? hit[0] : -1; render();
  } else if (k === "erase") {
    const hit = itemsAt(c.cx, c.cy, "t").concat(itemsAt(c.cx, c.cy, "f"));
    if (hit.length) { state.items.splice(hit[0], 1); selected = -1; changed = true; }
    else {
      const ed = edgeAt(c);
      if (ed && state.doors.delete(doorKey(ed.x, ed.y, ed.o))) changed = true;
    }
  }
  if (changed) { render(); scheduleUrl(true); }
  drawOverlay();
});
svg.addEventListener("pointermove", e => {
  const c = cellAt(e); hover = c;
  if (drawing && c) {
    const i = c.cy * W + c.cx;
    if (state.floor[i] !== drawing.value) { state.floor[i] = drawing.value; drawing.changed = true; render(); }
  }
  drawOverlay();
});
function endDrag() {
  if (drawing) {
    if (drawing.changed) { pruneDoors(); render(); scheduleUrl(true); }
    drawing = null;
  }
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);
svg.addEventListener("pointerleave", () => { if (!drawing) { hover = null; drawOverlay(); } });

function drawOverlay() {
  let s = "";
  if (hover) {
    const k = tool.kind;
    if (k === "floor" || k === "unfloor") {
      s += `<rect x="${hover.cx * S}" y="${hover.cy * S}" width="${S}" height="${S}" fill="${k === "floor" ? "#c9a24a" : "#b3412f"}" opacity=".35"/>`;
    } else if (k === "item") {
      const it = { t: tool.type, x: hover.cx, y: hover.cy, r: ghostRot }, [w, h] = dims(it);
      it.x = clamp(it.x, 0, W - w); it.y = clamp(it.y, 0, H - h);
      s += itemSVG(it, { ghost: true });
    } else if (k === "door" || k === "secret") {
      const ed = edgeAt(hover);
      if (ed) {
        if (ed.o === 0) s += `<rect x="${(ed.x + 1) * S - 5}" y="${ed.y * S + 3}" width="10" height="${S - 6}" fill="#c9a24a" opacity=".7"/>`;
        else s += `<rect x="${ed.x * S + 3}" y="${(ed.y + 1) * S - 5}" width="${S - 6}" height="10" fill="#c9a24a" opacity=".7"/>`;
      }
    } else {
      s += `<rect x="${hover.cx * S}" y="${hover.cy * S}" width="${S}" height="${S}" fill="#fff" opacity=".12"/>`;
    }
  }
  overG.innerHTML = s;
}

// ───────────────────────── UI: tools ─────────────────────────
const toolsEl = $("#tools");
function buildTools() {
  const base = [
    ["select", "Select", "#fff"], ["floor", "Paint floor", "#e6d7ae"], ["unfloor", "Clear floor", "#17120c"],
    ["door", "Door", "#8b5a2b"], ["secret", "Secret door", "#f0e6d0"], ["erase", "Eraser", "#b3412f"],
  ];
  let html = `<h2>Draw</h2><div class="tgrid">` +
    base.map(([k, n, c]) => `<button data-kind="${k}"><span class="sw" style="background:${c}"></span>${n}</button>`).join("") +
    `<button data-kind="rotate" title="Rotate (R)">⟳ Rotate</button></div>`;
  const groups = [...new Set(CATALOG.map(c => c.g))];
  for (const g of groups) {
    html += `<h2>${g}</h2><div class="tgrid">` +
      CATALOG.filter(c => c.g === g).map(c => `<button data-kind="item" data-type="${c.id}"><span class="sw" style="background:${c.color};${c.round ? "border-radius:50%" : ""}"></span>${esc(c.name)}</button>`).join("") + `</div>`;
  }
  toolsEl.innerHTML = html;
}
function markTool() {
  toolsEl.querySelectorAll("button").forEach(b => {
    const on = b.dataset.kind === tool.kind && (tool.kind !== "item" || +b.dataset.type === tool.type);
    b.classList.toggle("active", on);
  });
  svg.style.cursor = tool.kind === "select" ? "default" : "crosshair";
}
toolsEl.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.kind === "rotate") { doRotate(); return; }
  tool = { kind: b.dataset.kind, type: +b.dataset.type || 0 };
  if (tool.kind !== "select") selected = -1;
  markTool(); render(); drawOverlay();
});
function doRotate() {
  if (tool.kind === "item") { ghostRot ^= 1; drawOverlay(); }
  else if (selected >= 0) { rotateItem(state.items[selected]); render(); scheduleUrl(true); }
}
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "r" || e.key === "R") { doRotate(); }
  else if (e.key === "Delete" || e.key === "Backspace") { if (removeSelected()) { e.preventDefault(); render(); scheduleUrl(true); } }
  else if (e.key === "Escape") { selected = -1; render(); }
});

// ───────────────────────── UI: text + header ─────────────────────────
const fields = { num: "#qnum", title: "#qtitle", intro: "#qintro", notes: "#notes" };
function syncFields() { for (const k in fields) $(fields[k]).value = state[k]; }
for (const k in fields) {
  $(fields[k]).addEventListener("input", e => { state[k] = e.target.value; render(); scheduleUrl(false, 300); });
}
$("#copy").addEventListener("click", async () => {
  await syncUrl();
  try { await navigator.clipboard.writeText(location.href); $("#copy").textContent = "Copied!"; }
  catch { prompt("Copy this link:", location.href); }
  setTimeout(() => $("#copy").textContent = "Copy link", 1500);
});
$("#print-btn").addEventListener("click", () => window.print());
$("#clear").addEventListener("click", () => {
  if (!confirm("Start a new, empty map? (Your current map stays in browser history.)")) return;
  state = blankState(); selected = -1; syncFields(); render(); scheduleUrl(true);
});

// ───────────────────────── boot ─────────────────────────
buildTools(); markTool(); render();
window.addEventListener("popstate", loadFromHash);
window.addEventListener("hashchange", loadFromHash);
loadFromHash();
window.__qmg = { encodeState, decodeState, getState: () => state, setState: s => { state = s; render(); } }; // for tests
</script>
</body>
</html>
